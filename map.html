<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flight Map</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9body{
    margin:0;
    font-family:Arial,sans-serif;
}

header{
    background:#0b3d91;
    color:white;
    padding:15px;
}

#map{
    height:calc(100vh - 60px);
}

.legend{
    position:absolute;
    right:10px;
    top:80px;
    z-index:1000;
    background:white;
    padding:12px;
    border-radius:8px;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
}
</style>
</head>

<body>

<header>
    <h2>Flight Logbook Map</h2>
</header>

<div id="map"></div>

<div class="legend">
    <strong>Routes</strong><br>
    Blue lines = Flights
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leafletights.jsscript>

<script>

const map = L.map('map').setView([48.16,-122.16],8);

L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution:'© OpenStreetMap Contributors'
    }
).addTo(map);

for(const flight of flights){

    const from = airports[flight.from];
    const to = airports[flight.to];

    if(!from || !to) continue;

    L.marker(from).addTo(map);

    L.polyline(
        [from,to],
        {
            color:'#1e88e5',
            weight:3,
            opacity:0.7
        }
    ).addTo(map)
     .bindPopup(
        `
        <b>${flight.date}</b><br>
        ${flight.from} → ${flight.to}<br>
        ${flight.aircraft}
        `
     );
}

</script>

</body>
</html>
